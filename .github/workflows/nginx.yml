
name: Nginx CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Nginx Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          echo "Checking Nginx project..."
          ls -la
          test -f index.html
          test -f Dockerfile

      - name: Build Docker Image
        run: |
          docker build -t nginx-project .

      - name: Test Docker Container
        run: |
          docker run -d -p 8080:80 --name nginx-test nginx-project
          sleep 3
          curl --fail http://localhost:8080
          docker stop nginx-test
